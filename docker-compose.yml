services:
  papermc:
    image: itzg/minecraft-server:latest
    container_name: papermc
    ports:
      - "127.0.0.1:25565:25565"   # localhostのみ公開
    environment:
      EULA: "true"
      TYPE: "PAPER"
      VERSION: "26.2"
      MEMORY: "10G"
      USE_AIKAR_FLAGS: "true"
      TZ: "Asia/Tokyo"
      ONLINE_MODE: "true"
      WHITELIST: ""                # 例: "user1,user2"
      ENFORCE_WHITELIST: "true"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      # SEED: ""                   # 初回生成時のみ有効。既存worldがあれば無視される
    volumes:
      - ./data:/data
    restart: unless-stopped
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 1m

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    container_name: playit
    network_mode: host
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
